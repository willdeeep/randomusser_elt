[project]
name = "randomuser_elt"
dynamic = ["version"]
description = "Data Engineering technical assignment to create a simple Randomuser API extraction to seed, then normalise with dbt"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "willdeeep" }]
dependencies = [
    "dbt-core~=1.10.0",
    "dbt-sqlite~=1.10.0",
    "requests>=2.34.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "invoke>=2.2",
    "ruff>=0.8",
    "tenacity>=9.0",
]

[project.scripts]
randomuser_elt = "randomuser_elt.__main__:main"

[tool.uv]
# dbt-core 1.10.x/1.11.x (the only line dbt-sqlite's dbt-adapters~=1.16.0 pin
# supports) caps mashumaro<3.15, which predates Python 3.14 support (added in
# mashumaro 3.17). Override so uv resolves a mashumaro that actually works on
# this project's Python version instead of the stale upstream cap.
override-dependencies = ["mashumaro[msgpack]>=3.17"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/randomuser_elt"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests","tasks.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=migration_pipeline --cov-report=term-missing"
markers = [
    "integration: tests that hit external services or fixtures of them",
]
