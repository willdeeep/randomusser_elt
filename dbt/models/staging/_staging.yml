version: 2

models:
  - name: stg_randomuser
    description: "Typed, renamed pass-through of the randomuser seed. Grain: one row per person."
    columns:
      - name: email
        description: "Unique email address for the user."
        data_tests:
          - not_null
          - unique
      - name: gender
        description: "Text-based user gender category."
        data_tests:
          - accepted_values:
              arguments:
                values: ['male', 'female']
