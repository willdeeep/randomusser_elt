version: 2

models:
  - name: stg_randomuser
    description: "Typed, renamed pass-through of the randomuser seed. Grain: one row per person."
    columns:
      - name: email
        description: "Email address for the user. Not guaranteed unique — see seeds/_seeds.yml."
        data_tests:
          - not_null
      - name: gender
        description: "Text-based user gender category."
        data_tests:
          - accepted_values:
              arguments:
                values: ['male', 'female']
